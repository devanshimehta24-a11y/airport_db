<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Vendor | Airport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transition: 0.3s;
      background: #fff;
    }
    .card:hover {
      transform: scale(1.01);
    }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px;
    }
    .btn-primary {
      border-radius: 8px;
      padding: 8px 18px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container mt-4">
    <div class="top-bar">
      <h3 class="fw-bold">✈️ Edit Vendor Details</h3>
      <a href="/admin" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div class="card p-4">
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Vendor Name</label>
            <input type="text" class="form-control" name="Vendor_Name" value="{{ vendor.Vendor_Name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Service Type</label>
            <select class="form-select" name="Service_Type" required>
              {% for option in ['Food', 'Retail', 'Duty Free', 'Lounge', 'Transport', 'Other'] %}
                <option value="{{ option }}" {% if vendor.Service_Type == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Terminal ID</label>
            <input type="number" class="form-control" name="Terminal_ID" value="{{ vendor.Terminal_ID }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact Number</label>
            <input type="text" class="form-control" name="Contact_Number" value="{{ vendor.Contact_Number }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">License Expiry</label>
            <input type="date" class="form-control" name="License_Expiry" value="{{ vendor.License_Expiry }}">
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary me-3">Update</button>
          <a href="/vendor" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
