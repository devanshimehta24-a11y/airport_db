<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Management | Airport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card {
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .btn { border-radius: 8px; }
    .table thead { background-color: #212529; color: white; }
  </style>
</head>
<body>

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold">Terminal Management</h3>
    <a href="/admin" class="btn btn-secondary">← Back to Dashboard</a>
  </div>

  <form method="POST" action="{{ url_for('add_terminal') }}">
  <div class="form-container">
    <h2>Add New Terminal</h2>

    <label>Terminal ID:</label>
    <input type="text" name="terminal_id" required>

    <label>Name:</label>
    <input type="text" name="name" required>

    <label>Facility:</label>
    <input type="text" name="facility" required>

    <label>Capacity:</label>
    <input type="number" name="capacity" required>

    <button type="submit" class="btn">Add Terminal</button>
  </div>
</form>


  <div class="card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-semibold">All Terminals</h5></div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Facility</th>
            <th>Capacity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for t in terminals %}
          <tr>
            <td>{{ t.Terminal_ID }}</td>
            <td>{{ t.Name }}</td>
            <td>{{ t.Facility }}</td>
            <td>{{ t.Capacity }}</td>
            <td>
            <a href="{{ url_for('edit_terminal', terminal_id=t.Terminal_ID) }}" class="btn btn-sm btn-warning">Edit</a>

              <form action="/delete_terminal/{{ t.Terminal_ID }}" method="POST" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this terminal?')">Delete</button>
              </form>
            </td>
          </tr>
          {% else %}
          <tr><td colspan="5" class="text-center text-muted">No terminals found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Terminal Modal -->
<div class="modal fade" id="addTerminalModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Add Terminal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form action="/add_terminal" method="POST">
        <div class="modal-body">
          <label class="form-label">Name</label>
          <input type="text" class="form-control mb-3" name="name" required>

          <label class="form-label">Facility</label>
          <input type="text" class="form-control mb-3" name="facility">

          <label class="form-label">Capacity</label>
          <input type="number" class="form-control mb-3" name="capacity" required>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
