<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Gate | Airport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .container { margin-top: 60px; max-width: 700px; }
    .card { border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); padding: 30px; }
    .btn { border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/admin_gates" class="btn btn-secondary mb-3">← Back to Gates</a>
    <div class="card">
      <h3 class="fw-bold text-center mb-4">Edit Gate Details</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Gate ID</label>
          <input type="number" class="form-control" name="Gate_ID" value="{{ gate.Gate_ID }}" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Gate Name</label>
          <input type="text" class="form-control" name="Gate_Name" value="{{ gate.Gate_Name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Terminal ID</label>
          <input type="number" class="form-control" name="Terminal_ID" value="{{ gate.Terminal_ID }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Flight ID</label>
          <input type="number" class="form-control" name="Flight_ID" value="{{ gate.Flight_ID }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" name="Status">
            <option value="Available" {% if gate.Status == 'Available' %}selected{% endif %}>Available</option>
            <option value="Occupied" {% if gate.Status == 'Occupied' %}selected{% endif %}>Occupied</option>
          </select>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary me-2">Update</button>
          <a href="/admin_gates" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
