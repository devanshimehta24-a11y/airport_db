<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Flight</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3>Edit Flight {{ flight.Flight_ID }}</h3>
    <form method="POST" class="bg-white p-4 rounded shadow-sm">
        <div class="mb-3">
            <label>Departure Airport</label>
            <input type="text" name="departure_airport" value="{{ flight.Departure_Airport }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Arrival Airport</label>
            <input type="text" name="arrival_airport" value="{{ flight.Arrival_Airport }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Departure Time</label>
            <input type="datetime-local" name="departure_time" value="{{ flight.Departure_Time|replace(' ', 'T') }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Arrival Time</label>
            <input type="datetime-local" name="arrival_time" value="{{ flight.Arrival_Time|replace(' ', 'T') }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Status</label>
            <input type="text" name="status" value="{{ flight.Flight_Status }}" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Update Flight</button>
        <a href="{{ url_for('admin_flights_page') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
