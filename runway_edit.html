<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Runway</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f9f9f9;
      padding: 40px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
       
    <h2>Edit Runway</h2>
    <form method="POST" action="{{ url_for('edit_runway', runway_id=runway.Runway_ID) }}">
      <div class="mb-3">
        <label>Runway ID</label>
        <input type="text" class="form-control" value="{{ runway.Runway_ID }}" disabled>
      </div>
      <div class="mb-3">
        <label>Length</label>
        <input type="text" class="form-control" name="Length" value="{{ runway.Length }}" required>
      </div>
      <div class="mb-3">
        <label>Type</label>
        <input type="text" class="form-control" name="Type" value="{{ runway.Type }}" required>
      </div>
      <div class="mb-3">
        <label>Status</label>
        <select class="form-select" name="Status">
          <option value="Available" {% if runway.Status == 'Available' %}selected{% endif %}>Available</option>
          <option value="Occupied" {% if runway.Status == 'Occupied' %}selected{% endif %}>Occupied</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success">Update</button>
      <a href="{{ url_for('admin_runways') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
