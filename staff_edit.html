<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Staff | Airport Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f9 }
    .card { border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.1) }
    .btn-primary { border-radius:8px; padding:8px 16px }
    .back-btn { text-decoration:none; color:#0d6efd; font-weight:500 }
    .container { max-width:900px; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <a href="{{ url_for('staff_page') }}" class="back-btn mb-3 d-inline-block">&larr; Back to Staff List</a>
    <div class="card p-4">
      <h3 class="text-center fw-bold mb-4">Edit Staff Details</h3>
      <form method="POST" action="{{ url_for('update_staff', id=staff.Staff_ID) }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" value="{{ staff.Name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Role</label>
            <input type="text" class="form-control" name="role" value="{{ staff.Role }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Terminal ID</label>
            <input type="number" class="form-control" name="terminal_id" value="{{ staff.Terminal_ID }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Shift</label>
            <input type="text" class="form-control" name="shift" value="{{ staff.Shift }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" name="date_of_birth" value="{{ staff.Date_of_Birth }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" name="age" value="{{ staff.Age }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact Number</label>
            <input type="text" class="form-control" name="contact_number" value="{{ staff.Contact_Number }}">
          </div>
        </div>
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
