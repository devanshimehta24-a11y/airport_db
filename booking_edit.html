<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Booking | Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8fafc;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      border-radius: 15px;
    }
    h2 {
      font-weight: 600;
      color: #0d6efd;
    }
    .btn-primary {
      background-color: #0d6efd;
      border: none;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
    }
    .btn-secondary {
      background-color: #6c757d;
      border: none;
    }
    .btn-secondary:hover {
      background-color: #5c636a;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <div class="text-center mb-4">
      <h2>Edit Booking</h2>
      <p class="text-muted">Modify booking details below and click Update when done.</p>
    </div>

    <form method="POST" class="card p-4 shadow border-0">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="passenger_id" class="form-label">Passenger ID</label>
          <input type="number" class="form-control" id="passenger_id" name="passenger_id"
                 value="{{ booking.Passenger_ID }}" required>
        </div>
        <div class="col-md-6">
          <label for="flight_id" class="form-label">Flight ID</label>
          <input type="number" class="form-control" id="flight_id" name="flight_id"
                 value="{{ booking.Flight_ID }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="class" class="form-label">Class</label>
          <select id="class" name="class" class="form-select" required>
            <option value="Economy" {% if booking.Class == 'Economy' %}selected{% endif %}>Economy</option>
            <option value="Business" {% if booking.Class == 'Business' %}selected{% endif %}>Business</option>
            <option value="First" {% if booking.Class == 'First' %}selected{% endif %}>First</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="seat_no" class="form-label">Seat No</label>
          <input type="text" class="form-control" id="seat_no" name="seat_no" value="{{ booking.SeatNo }}">
        </div>
        <div class="col-md-4">
          <label for="booking_status" class="form-label">Status</label>
          <select id="booking_status" name="booking_status" class="form-select" required>
            <option value="Confirmed" {% if booking.Booking_status == 'Confirmed' %}selected{% endif %}>Confirmed</option>
            <option value="Pending" {% if booking.Booking_status == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Cancelled" {% if booking.Booking_status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="price" class="form-label">Price</label>
          <input type="number" step="0.01" min="0" class="form-control" id="price"
                 name="price" value="{{ booking.Price }}">
        </div>
        <div class="col-md-6">
          <label for="booking_date" class="form-label">Booking Date</label>
          <input type="date" class="form-control" id="booking_date" name="booking_date"
                 value="{{ booking.Booking_Date|safe }}">
        </div>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="{{ url_for('admin_bookings_page') }}" class="btn btn-secondary px-4">Back</a>
        <button type="submit" class="btn btn-primary px-4">Update Booking</button>
      </div>
    </form>
  </div>

</body>
</html>
